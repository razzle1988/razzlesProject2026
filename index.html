<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haka Ranch School</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    header { text-align: center; padding: 20px 0; background: #2e7d32; color: white; border-radius: 8px; margin-bottom: 20px; }
    nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
    nav button { background-color: #1b5e20; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    nav button:hover { background-color: #388e3c; }
    .page-section { display: none; }
    .active-section { display: block; }
    .student-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .student-title { font-size: 1.5rem; color: #2e7d32; border-bottom: 2px solid #a5d6a7; padding-bottom: 8px; }
    .lesson-card { background: #f9f9f9; border-left: 4px solid #4caf50; padding: 12px 16px; margin: 10px 0; border-radius: 4px; }
    .quiz-box { background: #e8f5e9; border: 1px dashed #4caf50; border-radius: 8px; padding: 15px; margin-top: 15px; }
    .action-btn { background-color: #2e7d32; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>🏡 Haka Ranch School</h1>
    <p>Welcome to our Homeschooling Dashboard</p>
  </header>

  <nav>
    <button onclick="showSection('home')">🏠 Home</button>
    <button onclick="showSection('science')">🔬 Science Module</button>
  </nav>

  <!-- HOME SECTION -->
  <div id="home" class="page-section active-section">
    <div class="student-card">
      <h2>Welcome back!</h2>
      <p>Select <strong>Science Module</strong> from the menu above to access Junainah and Hessa's active weekly science lessons, checklists, and quizzes.</p>
    </div>
  </div>

  <!-- SCIENCE SECTION -->
  <div id="science" class="page-section">
    <h2>🌿 Week 1 Science Curriculum</h2>
    <div id="science-content">Loading Science Data...</div>
  </div>

  <script>
    function showSection(sectionId) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active-section'));
      document.getElementById(sectionId).classList.add('active-section');
    }

    async function loadScienceData() {
      try {
        const response = await fetch('./data/science_week_1.json');
        const data = await response.json();
        
        let html = '';
        data.students.forEach(student => {
          html += `
            <div class="student-card">
              <h3 class="student-title">👧 ${student.name} (${student.age} yo) — ${student.topics.join(' & ')}</h3>
              <h4>📦 Materials Needed:</h4>
              <ul>${student.supplies_needed.map(item => `<li>${item}</li>`).join('')}</ul>
              
              <h4>📅 Daily Lessons:</h4>
              ${student.daily_lessons.map(lesson => `
                <div class="lesson-card">
                  <strong>Day ${lesson.day}:${lesson.title}</strong>
                  <p>${lesson.instructions}</p>
                </div>
              `).join('')}

              <div class="quiz-box">
                <h4>❓ ${student.quiz.title}</h4>
                ${student.quiz.questions.map((q, idx) => `
                  <p><strong>Q${idx + 1}: ${q.question}</strong></p>${q.options.map(opt => `<label><input type="radio" name="${q.id}" value="${opt}"> ${opt}</label><br>`).join('')}
                `).join('')}
              </div>
            </div>
          `;
        });

        html += `
          <div style="text-align: center; margin-top: 30px;">
            <button class="action-btn" onclick="alert('Week 1 Complete! API Call to generate Week 2 will trigger here.')">✨ Finish Week 1 & Generate Next Week</button>
          </div>
        `;

        document.getElementById('science-content').innerHTML = html;
      } catch (error) {
        document.getElementById('science-content').innerHTML = '<p>Error loading science data. Check that data/science_week_1.json exists!</p>';
        console.error(error);
      }
    }

    loadScienceData();
  </script>
</body>
</html>
