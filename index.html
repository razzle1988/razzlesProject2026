<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haka Ranch School - Science Curriculum</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    h1 { text-align: center; color: #2c3e50; }
    .student-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .student-title { font-size: 1.5rem; color: #2e7d32; border-bottom: 2px solid #a5d6a7; padding-bottom: 8px; }
    .lesson-card { background: #f9f9f9; border-left: 4px solid #4caf50; padding: 12px 16px; margin: 10px 0; border-radius: 4px; }
    .quiz-box { background: #e8f5e9; border: 1px dashed #4caf50; border-radius: 8px; padding: 15px; margin-top: 15px; }
    button { background-color: #2e7d32; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #1b5e20; }
  </style>
</head>
<body>

  <h1>🌿 Haka Ranch School - Week 1 Science</h1>
  <div id="app">Loading Week 1 curriculum...</div>

  <script>
    async function loadScienceData() {
      try {
        const response = await fetch('./data/science_week_1.json');
        const data = await response.json();
        
        let html = '';
        data.students.forEach(student => {
          html += `
            <div class="student-card">
              <h2 class="student-title">👧 ${student.name} (${student.age} yo) — ${student.topics.join(' & ')}</h2>
              <h3>📦 Materials Needed:</h3>
              <ul>${student.supplies_needed.map(item => `<li>${item}</li>`).join('')}</ul>
              
              <h3>📅 Daily Lessons:</h3>
              ${student.daily_lessons.map(lesson => `
                <div class="lesson-card">
                  <strong>Day ${lesson.day}:${lesson.title}</strong>
                  <p>${lesson.instructions}</p>
                </div>
              `).join('')}

              <div class="quiz-box">
                <h3>❓ ${student.quiz.title}</h3>
                ${student.quiz.questions.map((q, idx) => `
                  <p><strong>Q${idx + 1}: ${q.question}</strong></p>${q.options.map(opt => `<label><input type="radio" name="${q.id}" value="${opt}"> ${opt}</label><br>`).join('')}
                `).join('')}
              </div>
            </div>
          `;
        });

        html += `
          <div style="text-align: center; margin-top: 30px;">
            <button onclick="alert('Week 1 Complete! Get ready for Week 2!')">✨ Finish Week 1 & Generate Next Week</button>
          </div>
        `;

        document.getElementById('app').innerHTML = html;
      } catch (error) {
        document.getElementById('app').innerHTML = '<p>Error loading science data. Make sure data/science_week_1.json exists!</p>';
        console.error(error);
      }
    }

    loadScienceData();
  </script>
</body>
</html>
